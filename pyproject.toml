[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["services/ai/.venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["services/ai/tests"]
pythonpath = ["services/ai"]
