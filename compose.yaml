name: cadebit

services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: cadebit
      POSTGRES_USER: cadebit
      POSTGRES_PASSWORD: cadebit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadebit -d cadebit"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  storage:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-cadebit}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-cadebit-local-storage-secret}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-storage-data:/data

  storage-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://storage:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cadebit}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-cadebit-local-storage-secret}
      S3_BUCKET: ${S3_BUCKET:-cadebit-materials}
    depends_on:
      storage:
        condition: service_healthy

  ai:
    build:
      context: services/ai
    environment:
      CADEBIT_ENVIRONMENT: production
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8000
      DATABASE_URL: postgresql://cadebit:cadebit@database:5432/cadebit
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-compose-development-ai-service-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-1200}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_TOP_K: ${RAG_TOP_K:-6}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.15}
      RAG_MAX_CONTEXT_CHARACTERS: ${RAG_MAX_CONTEXT_CHARACTERS:-16000}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

  ai-worker:
    build:
      context: services/ai
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    environment:
      CADEBIT_ENVIRONMENT: production
      AI_SERVICE_LOG_LEVEL: ${AI_SERVICE_LOG_LEVEL:-info}
      DATABASE_URL: postgresql://cadebit:cadebit@database:5432/cadebit
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      MATERIAL_PIPELINE_VERSION: ${MATERIAL_PIPELINE_VERSION:-v1}
      INGESTION_WORKER_POLL_SECONDS: ${INGESTION_WORKER_POLL_SECONDS:-2}
      INGESTION_WORKER_LEASE_SECONDS: ${INGESTION_WORKER_LEASE_SECONDS:-600}
      INGESTION_RETRY_BASE_SECONDS: ${INGESTION_RETRY_BASE_SECONDS:-5}
      S3_ENDPOINT: http://storage:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-cadebit-materials}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cadebit}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-cadebit-local-storage-secret}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

  migrate:
    build:
      context: apps/web
      target: migration
    environment:
      DATABASE_URL: postgresql://cadebit:cadebit@database:5432/cadebit
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: apps/web
    environment:
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-compose-development-ai-service-token}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-35000}
      MATERIAL_PIPELINE_VERSION: ${MATERIAL_PIPELINE_VERSION:-v1}
      S3_ENDPOINT: http://storage:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-cadebit-materials}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cadebit}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-cadebit-local-storage-secret}
      S3_FORCE_PATH_STYLE: "true"
      DATABASE_URL: postgresql://cadebit:cadebit@database:5432/cadebit
      BETTER_AUTH_SECRET: compose-development-secret-change-before-production
      BETTER_AUTH_URL: http://localhost:3000
    depends_on:
      ai:
        condition: service_healthy
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  object-storage-data:
