name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Type-check
        run: npm exec -- tsc --noEmit

      - name: Build
        run: npm run build

  ai:
    name: AI service
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai/requirements.txt
            services/ai/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement services/ai/requirements-dev.txt

      - name: Lint
        run: python -m ruff check services/ai

      - name: Check formatting
        run: python -m ruff format --check services/ai

      - name: Test
        run: python -m pytest

      - name: Validate Compose configuration
        run: docker compose config --quiet
