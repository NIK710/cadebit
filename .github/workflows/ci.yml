name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://cadebit:cadebit@127.0.0.1:5432/cadebit_test
      BETTER_AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
    services:
      database:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: cadebit_test
          POSTGRES_USER: cadebit
          POSTGRES_PASSWORD: cadebit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadebit -d cadebit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check database migrations
        run: npm run db:check

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Unit test
        run: npm test

      - name: Integration test
        run: npm run test:integration

      - name: Type-check
        run: npm exec -- tsc --noEmit

      - name: Build
        run: npm run build

  ai:
    name: AI service
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai/requirements.txt
            services/ai/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement services/ai/requirements-dev.txt

      - name: Lint
        run: python -m ruff check services/ai

      - name: Check formatting
        run: python -m ruff format --check services/ai

      - name: Test
        run: python -m pytest

      - name: Validate Compose configuration
        run: docker compose config --quiet
